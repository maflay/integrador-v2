<!DOCTYPE html>
<html lang="es">

<head>
    <title>GrandAladdin | Bono</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
</head>

<body>
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
    </div>
    <div class="_main_content_bono_grandal_">
        <div class="_content_form_bono_">
            <div class="_content_input_bono_">
                <input type="text" name="nombre" id="nombre" placeholder="Nombre">
                <input type="number" name="nombre" id="cedula" placeholder="Cédula">
            </div>
            <div class="_content_input_bono_">
                <input type="text" name="email" id="email" placeholder="Email">
                <input type="text" name="celular" id="celular" placeholder="Celular">
            </div>
            <div class="_content_input_bono_">
                <span>Lee atentamente:</span>
            </div>
            <div class="_content_check_bono_">
                <input type="checkbox" id="_check_mayor_">
                <p>Confirmo que soy mayor de 18 años.</p>
            </div>
            <div class="_content_captcha_">
                <span id="num_one">0</span> + <span id="num_dos">0</span>=<input type="number" name="result"
                    id="result_cap">
            </div>
            <button id="_btn_get_bono_">QUIERO MI BONO</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
