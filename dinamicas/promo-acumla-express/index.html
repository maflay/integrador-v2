<!DOCTYPE html>
<html lang="es">

<head>
    <title>Aladdin: Gana Max</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/modal.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
</head>

<body data-main-style="/dinamicas/promo-acumla-express/style.css"
    data-main-script="/dinamicas/promo-acumla-express/script.js">
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
    </div>
    <div class="_content_main_ax_">
        <div class="_est_sche_">
            <input id="_hor_ini_" min="1" max="24" class="form-control" type="number"
                placeholder="Hora inicio - formato 24H, Ej: 11">
            <input id="_hor_fin_" min="1" max="24" class="form-control" type="number"
                placeholder="Hora final - formato 24H, Ej: 18">
            <button id="_send_sched_" class="btn btn-primary">Enviar</button>
            <p id="_rango_fec_estas_">00:00:00 - 00:00:00</p>
        </div>
        <div class="_card_actions_ax_">
            <div class="_register_ax_">
                <img src="/dinamicas/grandaladdin/resources/Grand-aladdin-Prestige-Logo-otro.png" alt="Aladdin">
                <h2>Registrar Jugador</h2>
                <input id="cedula" type="text" class="form-control" placeholder="Cédula">
                <input onkeyup="this.value = this.value.toUpperCase()" id="nombre" type="text" class="form-control"
                    placeholder="Nombre">
                <select class="form-control" style="cursor: pointer;" id="casino">
                    <option value="">Casino...</option>
                    <option value="A05">A05</option>
                    <option value="A07">A07</option>
                    <option value="A08">A08</option>
                    <option value="A09">A09</option>
                    <option value="A10">A10</option>
                    <option value="A10-MESAS">A10-MESAS</option>
                    <option value="A12">A12</option>
                    <option value="A12-MESAS">A12-MESAS</option>
                    <option value="A15">A15</option>
                    <option value="A15-MESAS">A15-MESAS</option>
                    <option value="A16">A16</option>
                    <option value="A19">A19</option>
                    <option value="A35">A35</option>
                    <option value="A36">A36</option>
                    <option value="A36-MESAS">A36-MESAS</option>
                    <option value="A38">A38</option>
                    <option value="A39">A39</option>
                    <option value="A43">A43</option>
                    <option value="A48">A48</option>
                    <option value="A48-MESAS">A48-MESAS</option>
                    <option value="A49">A49</option>
                    <option value="A50">A50</option>
                    <option value="A53">A53</option>
                    <option value="A58">A58</option>
                    <option value="A70">A70</option>
                    <option value="A781">A781</option>
                    <option value="A88">A88</option>
                    <option value="A100">A100</option>
                    <option value="A108">A108</option>
                    <option value="A108-MESAS">A108-MESAS</option>
                    <option value="A127">A127</option>
                    <option value="A127-MESAS">A127-MESAS</option>
                </select>
                <input id="telefono" type="number" class="form-control" placeholder="Teléfono">
                <button id="_btn_imprimir_last_" class="btn btn-danger">Imprimir ultimo registro</button>
                <button id="_btn_crear_player_" class="btn btn-primary">Crear</button>
            </div>
            <div class="_upda_ax_">
                <div style="width: 200px; margin-bottom: 20px;">

                    <input style="display: none;" type="text" name="numero_bus" id="numero_bus" class="form-control"
                        placeholder="Buscar...">
                </div>

                <div style="color: white;" id="_all_register_zxwerz_"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/dinamicas/actions_js/menu_modal.js"></script>
    <script src="/dinamicas/user.js"></script>
    <script src="/dinamicas/extension.js"></script>

</body>

</html>
