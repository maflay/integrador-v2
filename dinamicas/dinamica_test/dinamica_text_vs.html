<div id="miItem" style="position: absolute; left: 50px; top: 50px; width: 100px; height: 100px; background: #2ecc71; cursor: grab; user-select: none;">
  Arrástrame
</div>

<script>

    const item = document.getElementById('miItem');

// Variables para guardar el desfase entre el cursor y la esquina superior izquierda del elemento
let offsetX = 0;
let offsetY = 0;
let esArrastrando = false;

// 1. Cuando presionas el click sobre el elemento
item.addEventListener('mousedown', (evento) => {
    esArrastrando = true;
    item.style.cursor = 'grabbing';
    
    // Calcular la distancia exacta desde donde hiciste click dentro del cuadrado
    offsetX = evento.clientX - item.offsetLeft;
    offsetY = evento.clientY - item.offsetTop;
});

// 2. Cuando mueves el mouse por toda la pantalla (document)
document.addEventListener('mousemove', (evento) => {
    if (!esArrastrando) return; // Si no hay click sostenido, no hace nada
    
    // Restamos el desfase original para que el cursor se quede en el mismo punto donde diste click
    item.style.left = `${evento.clientX - offsetX}px`;
    item.style.top = `${evento.clientY - offsetY}px`;
});

// 3. Cuando sueltas el click en cualquier parte de la pantalla
document.addEventListener('mouseup', () => {
    esArrastrando = false;
    item.style.cursor = 'grab';
});

</script>
