<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            margin: 0;
            background-color: #0d0d0d;
        }

        /* Define el rango de scroll total */
        .scroll-container {
            height: 400vh;
            /* Ajusta la duración del recorrido del scroll */
            position: relative;
        }

        .sticky-wrapper {
            position: sticky;
            top: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <div class="scroll-container">
        <div class="sticky-wrapper">
            <video id="scrollVideo" preload="auto" muted playsinline>
                <source src="/dinamicas/grandaladdin/resources/4870_Poker_Chips_1280x720.mp4" type="video/mp4">
            </video>
        </div>
    </div>
    <script>
        const video = document.getElementById('scrollVideo');
        const container = document.querySelector('.scroll-container');

        let targetTime = 0;
        let animationFrameId;

        // Esperar metadatos para conocer la duración exacta
        video.addEventListener('loadedmetadata', () => {
            window.addEventListener('scroll', onScroll, { passive: true });
        });

        function onScroll() {
            const containerRect = container.getBoundingClientRect();
            const maxScroll = containerRect.height - window.innerHeight;
            const currentScroll = Math.max(0, -containerRect.top);

            // Calcular porcentaje de desplazamiento dentro del contenedor (0 a 1)
            const scrollFraction = Math.min(1, Math.max(0, currentScroll / maxScroll));

            // Asignar tiempo correspondiente del video
            targetTime = scrollFraction * video.duration;

            if (!animationFrameId) {
                animationFrameId = requestAnimationFrame(updateVideoTime);
            }
        }

        function updateVideoTime() {
            if (Math.abs(video.currentTime - targetTime) > 0.01) {
                video.currentTime = targetTime;
            }
            animationFrameId = null;
        }
    </script>
</body>

</html>
