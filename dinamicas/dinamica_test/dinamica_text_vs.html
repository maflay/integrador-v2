<div class="mo-menu-wrap">
    <style>
        .mo-menu-wrap {
            --brown-deep: #4a2e1f;
            --brown-mid: #8a5a35;
            --brown-line: #b6905f;
            --brown-soft: #e6e4de;
            --parchment: #f5f3ee;
            --parchment-2: #dbdbd5;
            --ink: #3a2a1c;
            font-family: 'Lato', Arial, sans-serif;
            font-size: 15pt;
            max-width: 820px;
            margin: 0 auto;
            padding: 10px 6px 40px;
            color: var(--ink);
            background: transparent;
        }

        .mo-menu-wrap * {
            box-sizing: border-box;
        }

        .mo-menu-title {
            text-align: center;
            font-family: 'Cinzel', serif;
            font-weight: 600;
            font-size: 2em;
            letter-spacing: .08em;
            color: var(--brown-deep);
            margin: 0 0 6px;
        }

        .mo-menu-sub {
            text-align: center;
            font-family: 'Cinzel', serif;
            color: var(--brown-mid);
            font-size: 15pt;
            letter-spacing: .25em;
            text-transform: uppercase;
            margin: 0 0 8px;
        }

        .mo-divider-top {
            text-align: center;
            color: var(--brown-line);
            font-size: 15pt;
            letter-spacing: .3em;
            margin: 6px 0 26px;
            user-select: none;
        }

        .mo-accordion {
            border-top: 1px solid var(--brown-line);
        }

        .mo-item {
            border-bottom: 1px solid var(--brown-line);
        }

        .mo-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 8px;
            cursor: pointer;
            background: transparent;
            transition: background .35s ease, padding-left .35s ease;
            position: relative;
        }

        .mo-header:hover {
            background: var(--brown-soft);
            padding-left: 16px;
        }

        .mo-icon {
            color: var(--brown-mid);
            font-size: 1.2em;
            flex: 0 0 auto;
            transition: transform .45s cubic-bezier(.4, 0, .2, 1), color .3s ease;
            display: inline-block;
        }

        .mo-item.is-open>.mo-header .mo-icon {
            transform: rotate(135deg);
            color: var(--brown-deep);
        }

        .mo-header-text {
            flex: 1 1 auto;
        }

        .mo-header-eyebrow {
            display: block;
            font-family: 'Cinzel', serif;
            font-size: 15pt;
            letter-spacing: .28em;
            text-transform: uppercase;
            color: var(--brown-mid);
            margin-bottom: 4px;
        }

        .mo-header-title {
            display: block;
            font-family: 'Cinzel', serif;
            font-weight: 600;
            font-size: 20pt;
            letter-spacing: .03em;
            color: var(--brown-deep);
        }

        .mo-chevron {
            flex: 0 0 auto;
            width: 12px;
            height: 12px;
            border-right: 1px solid var(--brown-mid);
            border-bottom: 1px solid var(--brown-mid);
            transform: rotate(45deg);
            transition: transform .4s ease, border-color .3s ease;
            margin-right: 4px;
        }

        .mo-item.is-open>.mo-header .mo-chevron {
            transform: rotate(-135deg);
            border-color: var(--brown-deep);
        }

        .mo-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height .55s cubic-bezier(.4, 0, .2, 1);
            background: var(--parchment);
        }

        .mo-panel-inner {
            padding: 6px 20px 30px 40px;
        }

        .mo-section-title {
            text-align: center;
            font-family: 'Cinzel', serif;
            color: var(--brown-mid);
            font-size: 15pt;
            letter-spacing: .24em;
            text-transform: uppercase;
            margin: 26px 0 14px;
        }

        .mo-section-title:first-child {
            margin-top: 6px;
        }

        .mo-ornament {
            text-align: center;
            color: var(--brown-line);
            letter-spacing: .35em;
            margin: 22px 0 16px;
            font-size: 15pt;
            user-select: none;
        }

        .mo-dish {
            padding: 10px 0;
            border-bottom: 1px dotted var(--brown-line);
            transition: background .3s ease, padding-left .3s ease;
        }

        .mo-dish:last-child {
            border-bottom: none;
        }

        .mo-dish:hover {
            background: var(--parchment-2);
            padding-left: 8px;
        }

        .mo-dish-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 14px;
        }

        .mo-dish-name {
            font-family: 'Cinzel', serif;
            font-weight: 500;
            font-size: 15pt;
            color: var(--brown-deep);
            letter-spacing: .02em;
        }

        .mo-dish-price {
            font-family: 'Lato', sans-serif;
            font-size: 15pt;
            color: var(--brown-mid);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .mo-dish-desc {
            font-size: 15pt;
            color: #5c4632;
            margin-top: 4px;
            line-height: 1.5;
            font-style: italic;
        }

        .mo-note {
            font-size: 15pt;
            color: var(--brown-mid);
            text-align: center;
            margin-top: 18px;
            font-style: italic;
        }

        .mo-price-list {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .mo-price-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding-left: 4px;
            border-bottom: 1px dotted var(--parchment-2);
            padding-bottom: 3px;
        }

        .mo-price-row:last-child {
            border-bottom: none;
        }

        .mo-price-row span:first-child {
            color: var(--ink);
            opacity: .8;
            font-size: 15pt;
        }

        .mo-price-row span:last-child {
            color: var(--brown-mid);
            font-size: 15pt;
            white-space: nowrap;
        }

        .mo-choice-block {
            margin: 8px 0 18px;
        }

        .mo-choice-label {
            font-family: 'Cinzel', serif;
            font-weight: 600;
            color: var(--brown-deep);
            font-size: 15pt;
            letter-spacing: .06em;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mo-choice-label::before {
            content: "❖";
            color: var(--brown-mid);
            font-size: .9em;
        }

        .mo-choice-list {
            list-style: none;
            margin: 0 0 0 22px;
            padding: 0;
            columns: 2;
            column-gap: 24px;
        }

        .mo-choice-list li {
            padding: 4px 0;
            font-size: 15pt;
            color: var(--ink);
            break-inside: avoid;
        }

        .mo-choice-list li span.mo-extra {
            color: var(--brown-mid);
            font-size: 15pt;
        }

        @media (max-width:560px) {
            .mo-menu-title {
                font-size: 1.5em;
            }

            .mo-header-title {
                font-size: 17pt;
            }

            .mo-header-eyebrow {
                font-size: 15pt;
            }

            .mo-panel-inner {
                padding: 6px 12px 26px 26px;
            }

            .mo-choice-list {
                columns: 1;
            }

            .mo-dish-row {
                flex-direction: column;
                gap: 2px;
            }
        }
    </style>

<script>
    (function () {
        var accordion = document.getElementById('moAccordion');
        if (!accordion) return;
        var items = accordion.querySelectorAll('.mo-item');

        items.forEach(function (item) {
            var header = item.querySelector('.mo-header');
            var panel = item.querySelector('.mo-panel');

            header.addEventListener('click', function () {
                var isOpen = item.classList.contains('is-open');

                items.forEach(function (other) {
                    other.classList.remove('is-open');
                    other.querySelector('.mo-panel').style.maxHeight = null;
                });

                if (!isOpen) {
                    item.classList.add('is-open');
                    panel.style.maxHeight = panel.scrollHeight + 'px';
                }
            });
        });

        // Recalcula la altura si cambia el viewport (por ejemplo al girar el móvil)
        window.addEventListener('resize', function () {
            var openItem = accordion.querySelector('.mo-item.is-open');
            if (openItem) {
                var p = openItem.querySelector('.mo-panel');
                p.style.maxHeight = p.scrollHeight + 'px';
            }
        });
    })();
</script>
