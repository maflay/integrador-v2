<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      margin: 0;
      background-color: #000;
    }

    .scroll-container {
      height: 500vh;
    }

    canvas {
      position: sticky;
      top: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }
  </style>
</head>

<body>
  <div class="scroll-container">
    <canvas id="heroCanvas"></canvas>
  </div>
  <script>
    const canvas = document.getElementById('heroCanvas');
    const context = canvas.getContext('2d');

    // Configuración de cuadros
    const frameCount = 11; // Cantidad total de imágenes extraídas del video
    const currentFrame = index => (
      `./frames/4870_Poker_Chips_1280x720_${(index + 1).toString().padStart(4, '0')}.jpg`
    );

    const images = [];
    const videoState = { frame: 0 };

    // Precargar imágenes
    for (let i = 0; i < frameCount; i++) {
      const img = new Image();
      img.src = currentFrame(i);
      images.push(img);
    }

    // Ajustar resolución de Canvas
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      render();
    }

    function render() {
      const img = images[videoState.frame];
      if (img && img.complete) {
        // Escalar imagen manteniendo aspect-ratio (contain/cover)
        const hRatio = canvas.width / img.width;
        const vRatio = canvas.height / img.height;
        const ratio = Math.max(hRatio, vRatio);
        const centerShift_x = (canvas.width - img.width * ratio) / 2;
        const centerShift_y = (canvas.height - img.height * ratio) / 2;

        context.clearRect(0, 0, canvas.width, canvas.height);
        context.drawImage(
          img, 0, 0, img.width, img.height,
          centerShift_x, centerShift_y, img.width * ratio, img.height * ratio
        );
      }
    }

    window.addEventListener('resize', resizeCanvas);
    images[0].onload = resizeCanvas;

    // Mapear scroll a frame
    window.addEventListener('scroll', () => {
      const scrollTop = window.scrollY;
      const maxScrollTop = document.documentElement.scrollHeight - window.innerHeight;
      const scrollFraction = scrollTop / maxScrollTop;

      const frameIndex = Math.min(
        frameCount - 1,
        Math.ceil(scrollFraction * frameCount)
      );

      requestAnimationFrame(() => {
        videoState.frame = frameIndex;
        render();
      });
    }, { passive: true });
  </script>
</body>

</html>
