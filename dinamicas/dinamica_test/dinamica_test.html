<div class="mb-menu-wrap">
	<style>
		.mb-menu-wrap {
			--brown-deep: #4a2e1f;
			--wine-mid: #a97a6d;
			--wine-line: #cbab97;
			--wine-soft: #e9e2de;
			--parchment: #f5f3ee;
			--parchment-2: #dbdbd5;
			--ink: #3a2a1c;
			font-family: 'Lato', Arial, sans-serif;
			font-size: 15pt;
			max-width: 820px;
			margin: 0 auto;
			padding: 10px 6px 40px;
			color: var(--ink);
			background: transparent;
		}

		.mb-menu-wrap * {
			box-sizing: border-box;
		}

		.mb-menu-title {
			text-align: center;
			font-family: 'Cinzel', serif;
			font-weight: 600;
			font-size: 2em;
			letter-spacing: .08em;
			color: var(--brown-deep);
			margin: 0 0 6px;
		}

		.mb-menu-sub {
			text-align: center;
			font-family: 'Cinzel', serif;
			color: var(--wine-mid);
			font-size: 15pt;
			letter-spacing: .25em;
			text-transform: uppercase;
			margin: 0 0 8px;
		}

		.mb-divider-top {
			text-align: center;
			color: var(--wine-line);
			font-size: 15pt;
			letter-spacing: .3em;
			margin: 6px 0 26px;
			user-select: none;
		}

		.mb-accordion {
			border-top: 1px solid var(--wine-line);
		}

		.mb-item {
			border-bottom: 1px solid var(--wine-line);
		}

		.mb-header {
			display: flex;
			align-items: center;
			gap: 14px;
			padding: 18px 8px;
			cursor: pointer;
			background: transparent;
			transition: background .35s ease, padding-left .35s ease;
			position: relative;
		}

		.mb-header:hover {
			background: var(--wine-soft);
			padding-left: 16px;
		}

		.mb-icon {
			color: var(--wine-mid);
			font-size: 1.2em;
			flex: 0 0 auto;
			transition: transform .45s cubic-bezier(.4, 0, .2, 1), color .3s ease;
			display: inline-block;
		}

		.mb-item.is-open>.mb-header .mb-icon {
			transform: rotate(135deg);
			color: var(--brown-deep);
		}

		.mb-drink-icon {
			flex: 0 0 auto;
			width: 30px;
			height: 30px;
			color: var(--wine-mid);
			transition: color .3s ease, transform .35s ease;
		}

		.mb-drink-icon svg {
			width: 100%;
			height: 100%;
			fill: none;
			stroke: currentColor;
			stroke-width: 1.4;
			stroke-linecap: round;
			stroke-linejoin: round;
		}

		.mb-item.is-open>.mb-header .mb-drink-icon {
			color: var(--brown-deep);
			transform: scale(1.06);
		}

		.mb-header-text {
			flex: 1 1 auto;
		}

		.mb-header-eyebrow {
			display: block;
			font-family: 'Cinzel', serif;
			font-size: 15pt;
			letter-spacing: .28em;
			text-transform: uppercase;
			color: var(--wine-mid);
			margin-bottom: 4px;
		}

		.mb-header-title {
			display: block;
			font-family: 'Cinzel', serif;
			font-weight: 600;
			font-size: 20pt;
			letter-spacing: .03em;
			color: var(--brown-deep);
		}

		.mb-chevron {
			flex: 0 0 auto;
			width: 12px;
			height: 12px;
			border-right: 1px solid var(--wine-mid);
			border-bottom: 1px solid var(--wine-mid);
			transform: rotate(45deg);
			transition: transform .4s ease, border-color .3s ease;
			margin-right: 4px;
		}

		.mb-item.is-open>.mb-header .mb-chevron {
			transform: rotate(-135deg);
			border-color: var(--brown-deep);
		}

		.mb-panel {
			max-height: 0;
			overflow: hidden;
			transition: max-height .55s cubic-bezier(.4, 0, .2, 1);
			background: var(--parchment);
		}

		.mb-panel-inner {
			padding: 6px 20px 30px 40px;
		}

		.mb-section-title {
			text-align: center;
			font-family: 'Cinzel', serif;
			color: var(--wine-mid);
			font-size: 15pt;
			letter-spacing: .24em;
			text-transform: uppercase;
			margin: 26px 0 14px;
		}

		.mb-section-title:first-child {
			margin-top: 6px;
		}

		.mb-ornament {
			text-align: center;
			color: var(--wine-line);
			letter-spacing: .35em;
			margin: 22px 0 16px;
			font-size: 15pt;
			user-select: none;
		}

		.mb-dish {
			padding: 12px 0;
			border-bottom: 1px dotted var(--wine-line);
			transition: background .3s ease, padding-left .3s ease;
		}

		.mb-dish:last-child {
			border-bottom: none;
		}

		.mb-dish:hover {
			background: var(--parchment-2);
			padding-left: 8px;
		}

		.mb-dish-row {
			display: flex;
			justify-content: space-between;
			align-items: baseline;
			gap: 14px;
		}

		.mb-dish-name {
			font-family: 'Cinzel', serif;
			font-weight: 500;
			font-size: 15pt;
			color: var(--brown-deep);
			letter-spacing: .02em;
		}

		.mb-dish-price {
			font-family: 'Lato', sans-serif;
			font-size: 15pt;
			color: var(--wine-mid);
			white-space: nowrap;
			font-variant-numeric: tabular-nums;
		}

		.mb-dish-desc {
			font-size: 15pt;
			color: #5c4632;
			margin-top: 4px;
			line-height: 1.5;
			font-style: italic;
		}

		.mb-note {
			font-size: 15pt;
			color: var(--wine-mid);
			text-align: center;
			margin-top: 18px;
			font-style: italic;
		}

		.mb-price-list {
			margin-top: 8px;
			display: flex;
			flex-direction: column;
			gap: 4px;
		}

		.mb-price-row {
			display: flex;
			justify-content: space-between;
			align-items: baseline;
			padding-left: 4px;
			border-bottom: 1px dotted var(--parchment-2);
			padding-bottom: 3px;
		}

		.mb-price-row:last-child {
			border-bottom: none;
		}

		.mb-price-row span:first-child {
			color: var(--ink);
			opacity: .8;
			font-size: 15pt;
		}

		.mb-price-row span:last-child {
			color: var(--wine-mid);
			font-size: 15pt;
			white-space: nowrap;
		}

		.mb-choice-block {
			margin: 8px 0 18px;
		}

		.mb-choice-label {
			font-family: 'Cinzel', serif;
			font-weight: 600;
			color: var(--brown-deep);
			font-size: 15pt;
			letter-spacing: .06em;
			margin-bottom: 8px;
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.mb-choice-label::before {
			content: "❖";
			color: var(--wine-mid);
			font-size: .9em;
		}

		.mb-choice-list {
			list-style: none;
			margin: 0 0 0 22px;
			padding: 0;
			columns: 2;
			column-gap: 24px;
		}

		.mb-choice-list li {
			padding: 4px 0;
			font-size: 15pt;
			color: var(--ink);
			break-inside: avoid;
			display: flex;
			justify-content: space-between;
			gap: 10px;
			max-width: 260px;
		}

		.mb-choice-list li span.mb-extra {
			color: var(--wine-mid);
			font-size: 15pt;
			white-space: nowrap;
		}

		@media (max-width:560px) {
			.mb-menu-title {

			}

			.mb-header-title {

			}

			.mb-header-eyebrow {

			}

			.mb-panel-inner {

			}

			.mb-choice-list {

			}

			.mb-dish-row {
				flex-direction: column;
				gap: 2px;
			}

			.mb-drink-icon {
				width: 26px;
				height: 26px;
			}
		}
	</style>

<script>
	(function () {
		var accordion = document.getElementById('mbAccordion');
		if (!accordion) return;
		var items = accordion.querySelectorAll('.mb-item');

		items.forEach(function (item) {
			var header = item.querySelector('.mb-header');
			var panel = item.querySelector('.mb-panel');

			header.addEventListener('click', function () {
				var isOpen = item.classList.contains('is-open');

				items.forEach(function (other) {
					other.classList.remove('is-open');
					other.querySelector('.mb-panel').style.maxHeight = null;
				});

				if (!isOpen) {
					item.classList.add('is-open');
					panel.style.maxHeight = panel.scrollHeight + 'px';
				}
			});
		});

		window.addEventListener('resize', function () {
			var openItem = accordion.querySelector('.mb-item.is-open');
			if (openItem) {
				var p = openItem.querySelector('.mb-panel');
				p.style.maxHeight = p.scrollHeight + 'px';
			}
		});
	})();
</script>
