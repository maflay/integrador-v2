<script>
	// Función centralizada para leer la ruta actual desde el navegador
function obtenerRutaActual() {
  // Obtiene el path, ej: "/contacto" -> "contacto"
  const path = window.location.pathname.replace(/^\/+/, "");
  return path === "" ? "inicio" : path;
}

// Modificar navegarA para usar pushState en lugar de hash
function navegarA(valor) {
  const [clave, query] = valor.split("?");

  if (!rutasLimpias[clave]) {
    console.error("Ruta no definida:", clave);
    return;
  }

  // Construimos la nueva URL limpia
  const nuevaUrl = "/" + valor;

  // Actualiza la URL del navegador sin recargar la página
  history.pushState({ clave, query }, "", nuevaUrl);

  // Cargamos la vista correspondiente
  ejecutarCargaVista(clave, query);
}

// Función que maneja la carga de la vista y los parámetros de búsqueda/scroll
function ejecutarCargaVista(clave, queryStr = "") {
  PageLoader.cargarPagina(clave);

  if (queryStr) {
    const params = new URLSearchParams(queryStr);
    const seccionId = params.get("id");

    if (seccionId) {
      setTimeout(() => {
        const elemento = document.getElementById(seccionId);
        if (elemento) {
          elemento.scrollIntoView({ behavior: "smooth" });
        }
      }, 300);
    }
  }
}

// Escuchar cuando el usuario usa las flechas de "Atrás" o "Adelante" del navegador
window.addEventListener("popstate", () => {
  const clave = obtenerRutaActual();
  const query = window.location.search.slice(1);
  ejecutarCargaVista(clave, query);
});

// Inicialización al cargar la página por primera vez
document.addEventListener("DOMContentLoaded", () => {
  cargarHeaderYFooter();
  
  const claveInicial = obtenerRutaActual();
  const queryInicial = window.location.search.slice(1);

  if (rutasLimpias[claveInicial]) {
    ejecutarCargaVista(claveInicial, queryInicial);
  } else {
    // Si la ruta no existe, redirigir a inicio limpiamente
    navegarA("inicio");
  }
});
</script>
