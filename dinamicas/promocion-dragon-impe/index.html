    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import {
            getDatabase, ref, push, onChildAdded
        } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAXCMyH4zx--kZvJ_W1F1KAi5HKjPNxPHo",
            authDomain: "prueba-f0c25.firebaseapp.com",
            databaseURL: "https://prueba-f0c25-default-rtdb.firebaseio.com",
            projectId: "prueba-f0c25",
            storageBucket: "prueba-f0c25.firebasestorage.app",
            messagingSenderId: "984894736026",
            appId: "1:984894736026:web:210df90b981cbef7698123"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const NS = "apps/dragonHistory";
        const ROOM = "sala_dragon";

        const ordenesRef = ref(db, `${NS}/rooms/${ROOM}/ordenesBorrar`);

        window.deleteHistory = function () {
            let casino_admin = document.getElementById("casino_admin");

            if (!casino_admin.value) {
                Swal.fire({
                    icon: "warning",
                    title: "Selecciona un casino",
                    text: "Debes seleccionar el casino para ejecutar la limpieza."
                });
                return;
            }

            Swal.fire({
                title: "¿Estás seguro?",
                text: `Se borrará el historial para el casino ${casino_admin.value} en todos los dispositivos conectados.`,
                icon: "warning",
                showCancelButton: true,
                confirmButtonText: "Sí, borrar",
                cancelButtonText: "Cancelar"
            }).then((result) => {
                if (result.isConfirmed) {
                    push(ordenesRef, {
                        casinoTarget: casino_admin.value,
                        timestamp: Date.now()
                    }).then(() => {
                        Swal.fire("Enviado", "Orden de borrado enviada correctamente.", "success");
                    }).catch((error) => {
                        // console.error("Error al enviar orden a Firebase:", error);
                    });
                }
            });
        };

        onChildAdded(ordenesRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const casinoOrden = data.casinoTarget;
            const historialGuardado = JSON.parse(localStorage.getItem("saveLocalHistory"));

            if (historialGuardado && historialGuardado.Casino) {
                if (historialGuardado.Casino === casinoOrden) {
                    // console.log(`Coincide el casino ${casinoOrden}. Borrando historial local...`);

                    localStorage.removeItem("saveLocalHistory");

                    // window.location.reload();
                }
            }
        });
