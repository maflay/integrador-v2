<!DOCTYPE html>
<html lang="es">

<head>
    <title>Aladdin: W Play</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/modal.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
</head>

<body data-main-style="/dinamicas/w_play/style.css" data-main-script="/dinamicas/w_play/script.js">
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
    </div>
    <div class="_content_main_w_play_">
        <img src="/dinamicas/w_play/resources/logo wplay-landing page grand aladdin-white.png" alt="Aladdin">
        <div class="_content_form_w_play_">
            <input onkeyup="this.value = this.value.toUpperCase();" class="form-control" style=" cursor: pointer;"
                type="text" id="nombre" placeholder="Nombre" />

            <select class="item_hide form-control" id="casino">
                <option value="">Casino...</option>
                <option value="A05">A05</option>
                <option value="A07">A07</option>
                <option value="A08">A08</option>
                <option value="A09">A09</option>
                <option value="A12">A12</option>
                <option value="A12-MESAS">A12-MESAS</option>
                <option value="A15">A15</option>
                <option value="A15-MESAS">A15-MESAS</option>
                <option value="A16">A16</option>
                <option value="A19">A19</option>
                <option value="A35">A35</option>
                <option value="A36">A36</option>
                <option value="A36-MESAS">A36-MESAS</option>
                <option value="A38">A38</option>
                <option value="A39">A39</option>
                <option value="A43">A43</option>
                <option value="A48">A48</option>
                <option value="A48-MESAS">A48-MESAS</option>
                <option value="A49">A49</option>
                <option value="A50">A50</option>
                <option value="A53">A53</option>
                <option value="A58">A58</option>
                <option value="A70">A70</option>
                <option value="A781">A781</option>
                <option value="A88">A88</option>
                <option value="A100">A100</option>
                <option value="A108">A108</option>
                <option value="A108-MESAS">A108-MESAS</option>
                <option value="A127">A127</option>
                <option value="A127-MESAS">A127-MESAS</option>
            </select>
            <input type="text" name="_num_wplay_" id="_num_wplay_" class="form-control" placeholder="# Teléfono">
            <input type="text" name="_valor_apostado_" id="_valor_apostado_" class="form-control"
                placeholder="Valor de Recarga">
            <input type="hidden" name="_valor_apostado_" id="_valor_apostado_int_" class="form-control"
                placeholder="Valor de Recarga">
            <select class="form-control" name="_antiguedad_wplay_" id="_antiguedad_wplay_">
                <option value="">El Jugador es...</option>
                <option value="Nuevo">Nuevo</option>
                <option value="Antiguo">Antiguo</option>
            </select>
            <button id="_btn_send_wplay_" class="btn btn-primary">Enviar</button>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/dinamicas/actions_js/menu_modal.js"></script>
    <script src="/dinamicas/user.js"></script>
    <script src="/dinamicas/extension.js"></script>
</body>

</html>
