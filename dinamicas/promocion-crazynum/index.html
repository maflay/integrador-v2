<!DOCTYPE html>
<html lang="es">

<head>
    <title>Aladdin: Números Locos</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/modal.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
</head>

<body data-main-style="/dinamicas/promocion-crazynum/style.css"
    data-main-script="/dinamicas/promocion-crazynum/script.js">
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
    </div>
    <div class="_main_crazyn_">
        <div class="_content_video_show_ ">
            <video autoplay muted loop playsinline style="width: 100%; height: auto;object-fit: cover;">
                <source src="/dinamicas/promocion-crazynum/resources/video_back.mp4" type="video/mp4">
                Tu navegador no soporta videos HTML5.
            </video>
        </div>
        <div class="content_opciones">

            <img id="btn_opciones" src="/resource/engranaje.png" alt="Aladdin">
        </div>
        <div class="_container_">
            <h2>Generador</h2>
            <div class="input-group">
                <input type="number" id="numeroInput" min="1" max="9999" placeholder="Ingresa un número (ej. 15)">
            </div>
            <button id="btnBuscar" onclick="iniciarBusqueda()">Generar Número</button>
        </div>
        <div class="_order_numero_gene_">
            <div class="content_numeros_gene"></div>
        </div>
    </div>

    <section id="modal_premios" class="modal_premios">
        <img class="close_modal_premios" id="close_modal_premios"
            src="/dinamicas/descubiertos/resources/close_boton.png" alt="Aladdin">
        <img class="modal_cambiar_premio" id="modal_cambiar_premio" src="/resource/img_cambiar.png" alt="Aladdin">
        <div class="_content_modal_premios_">
            <img id="img_premios_1" class="img_premios_1"
                src="/dinamicas/promocion-halloween-misterioso/resources/tabla_premio_1.png" alt="Aladdin">
            <img id="img_premios_2" class="img_premios_2"
                src="/dinamicas/promocion-halloween-misterioso/resources/tabla_premio_2.png" alt="Aladdin">
            <img id="img_premios_3" class="img_premios_3"
                src="/dinamicas/promocion-halloween-misterioso/resources/tabla_premio_3.png" alt="Aladdin">
            <img id="img_premios_4" class="img_premios_4"
                src="/dinamicas/promocion-halloween-misterioso/resources/tabla_premio_4.png" alt="Aladdin">
            <img id="img_premios_5" class="img_premios_4"
                src="/dinamicas/promocion-halloween-misterioso/resources/tabla_premio_5.png" alt="Aladdin">
            <img id="img_premios_6" class="img_premios_4"
                src="/dinamicas/promocion-halloween-misterioso/resources/tabla_premio_6.png" alt="Aladdin">

        </div>
    </section>
    <section id="modal_opciones_dinamica" class="modal_opciones_dinamica">
        <div id="content_modal_dinamica" class="content_modal_dinamica">
            <div class="content_expand">
                <img id="expandir" title="Expandir" src="/resource/expandir.png" alt="Aladdin">
            </div>
            <div class="content_head_modal">
                <div class="content_opcion_head">
                    <p id="btn_guardar_registro">Guardar Registro</p>
                </div>
                <div class="content_opcion_head">
                    <p id="btn_observacion">Observación</p>
                </div>
                <div class="content_opcion_head">
                    <p id="btn_envio_secundario">Consultar #</p>
                </div>
                <div class="content_opcion_head">
                    <p id="btn_registro_dia">Registro del Dia</p>
                    <span id="notificacion_registro_dia" class="notificacion_registro_dia"></span>
                </div>
                <div class="content_opcion_head">
                    <p id="btn_tabla_premios">Conteo</p>
                </div>
                <div id="close_modal_icon" class="close_modal_icon">&times;</div>
            </div>
            <div style="width: 100%;height: 1px;background-color: rgb(206, 206, 206);"></div>
            <div style="display: none;" id="view_guardar_registro" class="content_body_modal">
                <div class="info_body_modal">
                    <h2>Guardar Registro</h2>
                    <div class="datos_column_modal">
                        <div class="_content_datos_colum_modal">
                            <input onkeyup="this.value = this.value.toUpperCase();" class="form-control"
                                style=" cursor: pointer;" type="text" id="nombre" placeholder="Nombre" />
                            <input type="number" name="cedula" id="cedula" placeholder="Cédula" class="form-control">
                            <select class="form-control" style="cursor: pointer;" id="casino">
                                <option value="">Casino...</option>
                                <option value="A05">A05</option>
                                <option value="A07">A07</option>
                                <option value="A08">A08</option>
                                <option value="A09">A09</option>
                                <option value="A10">A10</option>
                                <option value="A10-MESAS">A10-MESAS</option>
                                <option value="A12">A12</option>
                                <option value="A12-MESAS">A12-MESAS</option>
                                <option value="A15">A15</option>
                                <option value="A15-MESAS">A15-MESAS</option>
                                <option value="A16">A16</option>
                                <option value="A19">A19</option>
                                <option value="A35">A35</option>
                                <option value="A36">A36</option>
                                <option value="A36-MESAS">A36-MESAS</option>
                                <option value="A38">A38</option>
                                <option value="A39">A39</option>
                                <option value="A43">A43</option>
                                <option value="A48">A48</option>
                                <option value="A48-MESAS">A48-MESAS</option>
                                <option value="A49">A49</option>
                                <option value="A50">A50</option>
                                <option value="A53">A53</option>
                                <option value="A58">A58</option>
                                <option value="A70">A70</option>
                                <option value="A781">A781</option>
                                <option value="A88">A88</option>
                                <option value="A100">A100</option>
                                <option value="A108">A108</option>
                                <option value="A108-MESAS">A108-MESAS</option>
                                <option value="A127">A127</option>
                                <option value="A127-MESAS">A127-MESAS</option>
                            </select>
                            <select class="form-control" id="categoria">
                                <option value="">Categoria...</option>
                                <option value="GENIUS">Genius</option>
                                <option value="TITANIO">Titanio</option>
                                <option value="LEGENDARIO">Legendario</option>
                                <option value="GOLD">Gold</option>
                                <option value="SILVER">Silver</option>
                                <option value="BRONCE">Bronce</option>
                                <option value="SUPERIOR">Superior</option>
                                <option value="ESTANDAR">Estandar</option>
                            </select>
                        </div>
                        <div class="content_btn_modal">
                            <button title="Enviar" id="btn_enviar" class="btn btn-primary">Enviar</button>
                        </div>
                    </div>
                </div>
            </div>
            <div style="display: none;" id="view_envio_secundario" class="content_body_modal">
                <div class="info_body_modal">
                    <h2>Consultar</h2>
                    <div><input style="display: none;" type="text" name="numero_bus" id="numero_bus" class="form-control" placeholder="Buscar..."></div>
                    <br/>
                    <div style="display: none;" class="result_dia_acumula" id="result_dia_all_tes"></div>
                    
                </div>
            </div>
            <div style="display: none;" id="view_envia_observacion" class="content_body_modal">
                <div class="info_body_modal">
                    <h2>Observación</h2>
                    <div class="datos_column_modal">
                        <select class="form-control" style="cursor: pointer;" id="casino_observacion">
                            <option value="">Casino...</option>
                            <option value="A05">A05</option>
                            <option value="A07">A07</option>
                            <option value="A08">A08</option>
                            <option value="A09">A09</option>
                            <option value="A10">A10</option>
                            <option value="A10-MESAS">A10-MESAS</option>
                            <option value="A12">A12</option>
                            <option value="A12-MESAS">A12-MESAS</option>
                            <option value="A15">A15</option>
                            <option value="A15-MESAS">A15-MESAS</option>
                            <option value="A16">A16</option>
                            <option value="A19">A19</option>
                            <option value="A35">A35</option>
                            <option value="A36">A36</option>
                            <option value="A36-MESAS">A36-MESAS</option>
                            <option value="A38">A38</option>
                            <option value="A39">A39</option>
                            <option value="A43">A43</option>
                            <option value="A48">A48</option>
                            <option value="A48-MESAS">A48-MESAS</option>
                            <option value="A49">A49</option>
                            <option value="A50">A50</option>
                            <option value="A53">A53</option>
                            <option value="A58">A58</option>
                            <option value="A70">A70</option>
                            <option value="A781">A781</option>
                            <option value="A88">A88</option>
                            <option value="A100">A100</option>
                            <option value="A108">A108</option>
                            <option value="A108-MESAS">A108-MESAS</option>
                            <option value="A127">A127</option>
                            <option value="A127-MESAS">A127-MESAS</option>
                        </select>
                    </div>
                    <div class="datos_column_modal">
                        <textarea placeholder="Descripcion" name="descripcion" id="descripcion_observacion"></textarea>
                    </div>
                    <div class="content_btn_modal">
                        <button style="display: none;" id="btn_clean_observacion"
                            class="btn btn-primary btn_acumula">Limpiar</button>
                        <button id="btn_envia_observacion" class="btn btn-primary btn_acumula">Enviar</button>
                    </div>
                </div>
            </div>
            <div style="display: none;" id="view_tabla_premios" class="content_body_modal">
                <div class="info_body_modal">
                    <h2>Conteo</h2>

                </div>
            </div>
            <div style="display: none;" id="view_registro_dia" class="content_body_modal">
                <div class="info_body_modal">
                    <h2>Registro del Dia</h2>
                    <div id="Info_result_dia"></div>
                    <div class="_control_cedu_search_">
                        <input type="text" name="cedu_search" class="form-control" placeholder="Cédula"
                            id="val_cedu_search">
                        <button class="btn btn-primary" id="btn_cedu_search">Buscar</button>

                    </div>
                    <div class="result_dia_acumula" id="result_dia_acumula"></div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/dinamicas/actions_js/menu_modal.js"></script>
    <script src="/dinamicas/user.js"></script>
    <script src="/dinamicas/extension.js"></script>
</body>

</html>
