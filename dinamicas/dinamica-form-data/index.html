<!DOCTYPE html>
<html lang="es">

<head>
    <title>Aladdin: Dinamica Form Data</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/modal.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
</head>

<body data-main-style="/dinamicas/dinamica-form-data/style.css"
    data-main-script="/dinamicas/dinamica-form-data/script.js">
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
    </div>
    <div class="_main_content_formdata_">
        <div class="container _form_formdata_">
            <img style="width: 250px;" src="/dinamicas/dinamica-form-data/resources/logo_dinamica_rapida.png"
                alt="Aladdin">
            <div id="_contentn_new_formadata_" class="_contentn_new_formadata_">
                <input type="text" name="_new_promo_" id="_new_promo_" class="form-control"
                    placeholder="Nueva Promoción">
                <button class="btn btn-primary" id="_btn_crear_new_promo_">Crear</button>
            </div>
            <input onkeyup="this.value = this.value.toUpperCase()" placeholder="Nombre..." type="text"
                class="form-control" id="nombre_form">
            <select class="form-control" name="_promo_crea_" id="_promo_crea_">
            </select>
            <select class="item_hide form-control" id="casino_form">
                <option value="">Casino...</option>
                <option value="A05">A05</option>
                <option value="A07">A07</option>
                <option value="A08">A08</option>
                <option value="A09">A09</option>
                <option value="A12">A12</option>
                <option value="A12-MESAS">A12-MESAS</option>
                <option value="A15">A15</option>
                <option value="A15-MESAS">A15-MESAS</option>
                <option value="A16">A16</option>
                <option value="A19">A19</option>
                <option value="A35">A35</option>
                <option value="A36">A36</option>
                <option value="A36-MESAS">A36-MESAS</option>
                <option value="A38">A38</option>
                <option value="A39">A39</option>
                <option value="A43">A43</option>
                <option value="A48">A48</option>
                <option value="A48-MESAS">A48-MESAS</option>
                <option value="A49">A49</option>
                <option value="A50">A50</option>
                <option value="A53">A53</option>
                <option value="A58">A58</option>
                <option value="A70">A70</option>
                <option value="A781">A781</option>
                <option value="A88">A88</option>
                <option value="A100">A100</option>
                <option value="A108">A108</option>
                <option value="A108-MESAS">A108-MESAS</option>
                <option value="A127">A127</option>
                <option value="A127-MESAS">A127-MESAS</option>
            </select>
            <select class="item_hide form-control" id="categoria_form">
                <option value="">Categoría...</option>
                <option value="GENIUS">Genius</option>
                <option value="TITANIO">Titanio</option>
                <option value="LEGENDARIO">Legendario</option>
                <option value="GOLD">Gold</option>
                <option value="SILVER">Silver</option>
                <option value="BRONCE">Bronce</option>
                <option value="ESTANDAR">Estándar</option>
                <option value="SUPERIOR">Superior</option>
                <option value="ADICIONAL">Adicional</option>
            </select>
            <input type="text" name="_new_num_bono_form_" placeholder="# Bono" id="_new_num_bono_form_"
                class="form-control">
            <input type="text" name="_new_resultado_form_" id="_new_resultado_form_" class="form-control"
                placeholder="Valor del Bono">
            <button class="btn btn-danger" id="_btn_send_new_promo_">Enviar</button>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/dinamicas/actions_js/menu_modal.js"></script>
    <script src="/dinamicas/user.js"></script>
    <script src="/dinamicas/extension.js"></script>
</body>

</html>
