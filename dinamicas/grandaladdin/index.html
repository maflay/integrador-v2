<!DOCTYPE html>
<html lang="es">

<head>
    <title>GrandAladdin.</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/css/modal.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
</head>

<body data-main-style="/dinamicas/grandaladdin/style.css" data-main-script="/dinamicas/grandaladdin/script.js">
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
    </div>

    <div class="_main_register_ga_">
        <div class="_content_video_show_ ">
            <video autoplay muted loop playsinline style="width: 100%; height: auto;object-fit: cover;">
                <source src="/dinamicas/grandaladdin/resources/4870_Poker_Chips_1280x720.mp4" type="video/mp4">
                Tu navegador no soporta videos HTML5.
            </video>
        </div>
        <div class="_content_form_ga_">
            <img src="/dinamicas/grandaladdin/resources/Grand-aladdin-Prestige-Logo.png" alt="Aladdin">
            <input type="text" name="nombre" id="nombre" class="form-control" placeholder="Nombre">
            <!-- <input type="text" name="casino" id="casino" class="form-control" placeholder="Casino"> -->
             <select name="casino" id="casino" class="form-control">
                <option value="">Casino...</option>
                <option value="BroadWay">BroadWay</option>
                <option value="HollyWood">HollyWood</option>
                <option value="Rio">Rio</option>
                <option value="Crown">Crown</option>
                <option value="Zamba">Zamba</option>
                <option value="Mega Fiesta">Mega Fiesta</option>
                <option value="otro">Otro</option>
             </select>
             <input type="text" name="otro_casino" id="otro_casino" class="form-control" placeholder="Casino...">
            <input type="text" name="maquinas" id="maquinas" class="form-control" placeholder="Máquina">
            <input type="text" name="telefono" id="telefono" class="form-control" placeholder="Télefono">
            <input type="text" name="cedula" id="cedula" class="form-control" placeholder="Cédula">
            <div>
                <button id="btn_send_form_ga" class="btn btn-primary">Enviar</button>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/dinamicas/extension.js"></script>
    <script src="/dinamicas/user.js"></script>
    <script src="/dinamicas/actions_js/menu_modal.js"></script>
</body>

</html>
